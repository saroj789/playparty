<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayParty - Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="relative h-screen w-screen overflow-hidden bg-zinc-950 font-sans select-none flex flex-col justify-between"
  >
    <!-- Dynamic Background Wallpaper -->
    <div
      id="bg-anime"
      class="absolute inset-0 bg-cover bg-center filter brightness-[0.6] blur-[2px] scale-105 transition-all duration-1000"
      style="
        background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920&auto=format&fit=crop');
      "
    ></div>
    <div
      class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-black/50 pointer-events-none"
    ></div>

    <!-- Hidden YouTube Player Instance -->
    <div id="yt-player" class="hidden"></div>

    <!-- Top Navigation -->
    <header
      class="relative z-20 w-full max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"
    >
      <div
        class="flex items-center gap-2 text-white font-bold tracking-wider text-sm bg-black/40 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 shadow-lg"
      >
        <span class="material-symbols-outlined text-rose-500 text-[18px]"
          >play_circle</span
        >
        <span>PlayParty</span>
      </div>

      <!-- Polished URL Input Control -->
      <div
        class="flex items-center gap-2 bg-black/40 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/10 shadow-lg transition-all focus-within:border-white/30"
      >
        <input
          id="playlist-url-input"
          type="text"
          placeholder="Paste YouTube Playlist URL..."
          class="bg-transparent text-white text-xs sm:text-sm focus:outline-none w-44 sm:w-72 placeholder-white/40"
        />
        <button
          id="load-playlist-btn"
          class="text-xs bg-white text-black font-bold px-3 py-1.5 rounded-full hover:bg-zinc-200 transition-colors cursor-pointer"
        >
          Load
        </button>
      </div>
    </header>

    <main
      class="relative z-10 flex-1 flex items-center justify-center pointer-events-none"
    ></main>

    <!-- Compact Player Bar -->
    <div class="relative z-20 w-full max-w-xl mx-auto px-4 pb-6">
      <div
        class="bg-black/60 backdrop-blur-xl border border-white/10 px-5 py-4 rounded-2xl shadow-2xl flex flex-col gap-3"
      >
        <div class="flex flex-col text-left">
          <h1
            id="track-title"
            class="text-white text-sm sm:text-base font-semibold tracking-tight truncate"
          >
            Loading...
          </h1>
          <p id="track-artist" class="text-zinc-400 text-xs truncate">
            Ready for playback
          </p>
        </div>

        <div class="flex flex-col gap-1">
          <div
            id="progress-container"
            class="w-full h-1 bg-white/20 rounded-full relative overflow-hidden cursor-pointer group"
          >
            <div
              id="progress-played"
              class="absolute left-0 top-0 h-full bg-rose-500 rounded-full w-0 transition-all duration-75"
            ></div>
          </div>
          <div class="flex justify-between text-[10px] text-zinc-400 font-mono">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <!-- Controls, Playback & Volume Bar Layout -->
        <div class="flex items-center justify-between w-full pt-0.5">
          <!-- Non-shifting Smooth Volume Control with Increased Height and Left Padding -->
          <div class="relative flex items-center group h-10 w-10">
            <button
              id="btn-mute"
              class="absolute left-0 z-10 text-zinc-400 hover:text-white transition-colors cursor-pointer focus:outline-none flex items-center h-full pl-2.5"
              title="Mute / Unmute"
            >
              <span
                id="volume-icon"
                class="material-symbols-outlined text-[24px]"
                >volume_up</span
              >
            </button>
            <div
              id="volume-pill-container"
              class="absolute left-0 top-1/2 -translate-y-1/2 flex items-center gap-1.5 bg-black/35 backdrop-blur-md pl-4 pr-4 py-4 rounded-full border border-white/10 opacity-0 group-hover:opacity-100 pointer-events-none group-hover:pointer-events-auto transition-all duration-200 shadow-2xl cursor-pointer"
            >
              <div class="w-6"></div>
              <input
                id="volume-slider"
                type="range"
                min="0"
                max="100"
                value="100"
                class="w-20 accent-rose-500 cursor-pointer h-1 bg-white/20 rounded-lg appearance-none"
              />
            </div>
          </div>

          <!-- Playback Controls -->
          <div class="flex items-center gap-6">
            <button
              id="btn-prev"
              class="text-zinc-300 hover:text-white transition-transform hover:scale-110 active:scale-95 cursor-pointer"
            >
              <span class="material-symbols-outlined text-[28px]"
                >skip_previous</span
              >
            </button>
            <button
              id="btn-play-pause"
              class="w-11 h-11 rounded-full bg-white hover:bg-zinc-200 text-black flex items-center justify-center transition-all transform hover:scale-105 active:scale-95 shadow-lg cursor-pointer"
            >
              <span id="play-icon" class="material-symbols-outlined text-[26px]"
                >play_arrow</span
              >
            </button>
            <button
              id="btn-next"
              class="text-zinc-300 hover:text-white transition-transform hover:scale-110 active:scale-95 cursor-pointer"
            >
              <span class="material-symbols-outlined text-[28px]"
                >skip_next</span
              >
            </button>
          </div>

          <!-- Layout Spacer to Keep Play Center-Aligned -->
          <div class="w-10"></div>
        </div>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
  </body>
</html>
